name: Android Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test playback UI against original Stitch screens
        run: |
          npm install --prefix "$RUNNER_TEMP/xmusic-ui-test" jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/xmusic-ui-test/node_modules" node scripts/playback-ui.test.cjs
          NODE_PATH="$RUNNER_TEMP/xmusic-ui-test/node_modules" node scripts/app-actions.test.cjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent development signing key
        env:
          XMUSIC_DEBUG_KEYSTORE_BASE64: ${{ secrets.XMUSIC_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$XMUSIC_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the XMUSIC_DEBUG_KEYSTORE_BASE64 repository secret before building."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$XMUSIC_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          actual=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha1sum | cut -d' ' -f1)
          if [ "$actual" != "d1666252a15cb05dc2df52ab4700eaf0fafbe643" ]; then
            echo "::error::Signing certificate does not match the registered XMusic development certificate."
            exit 1
          fi
          echo "Signing certificate verified: D1:66:62:52:A1:5C:B0:5D:C2:DF:52:AB:47:00:EA:F0:FA:FB:E6:43"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run local unit and Stitch asset integrity tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify final APK signing certificate
        run: |
          python3 - <<'PY'
          import pathlib, struct, hashlib
          apk = next(pathlib.Path("app/build/outputs/apk/debug").glob("*.apk"))
          data = apk.read_bytes()
          eocd = data.rfind(b"PK\x05\x06")
          directory = struct.unpack_from("<I", data, eocd + 16)[0]
          assert data[directory-16:directory] == b"APK Sig Block 42", "Signing block missing"
          size = struct.unpack_from("<Q", data, directory-24)[0]
          pos = directory-size
          def field(blob, offset=0):
              length = struct.unpack_from("<I", blob, offset)[0]
              return blob[offset+4:offset+4+length], offset+4+length
          found = False
          while pos < directory-24:
              length = struct.unpack_from("<Q", data, pos)[0]
              kind = struct.unpack_from("<I", data, pos+8)[0]
              value = data[pos+12:pos+8+length]
              pos += 8+length
              if kind == 0x7109871a:
                  signers, _ = field(value)
                  signer, _ = field(signers)
                  signed, _ = field(signer)
                  _, offset = field(signed)
                  certs, _ = field(signed, offset)
                  cert, _ = field(certs)
                  actual = hashlib.sha1(cert).hexdigest()
                  assert actual == "d1666252a15cb05dc2df52ab4700eaf0fafbe643", actual
                  found = True
          assert found, "APK v2 signer missing"
          print("Final APK certificate verified.")
          PY
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xmusic-family-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
