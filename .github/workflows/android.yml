name: Android Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test playback UI against original Stitch screens
        run: |
          npm install --prefix "$RUNNER_TEMP/xmusic-ui-test" jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/xmusic-ui-test/node_modules" node scripts/playback-ui.test.cjs
          NODE_PATH="$RUNNER_TEMP/xmusic-ui-test/node_modules" node scripts/app-actions.test.cjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run local unit and Stitch asset integrity tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xmusic-family-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

