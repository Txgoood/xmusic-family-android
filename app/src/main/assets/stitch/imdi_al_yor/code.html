<script>
  (function() {
    const playBtn = document.getElementById('mainPlayPause');
    const playIcon = document.getElementById('playIcon');
    let isPlaying = true;

    playBtn?.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.textContent = 'pause';
      } else {
        playIcon.textContent = 'play_arrow';
      }
    });

    const likeBtn = document.getElementById('likeBtn');
    let isLiked = true;
    likeBtn?.addEventListener('click', () => {
      isLiked = !isLiked;
      const icon = likeBtn.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.style.fontVariationSettings = isLiked ? "'FILL' 1" : "'FILL' 0";
        icon.style.color = isLiked ? '#20DF64' : '#bbcbb8';
      }
    });

    // Scrubber interaction mockup
    const scrubber = document.getElementById('scrubberContainer');
    const progress = document.getElementById('progressBar');
    const thumb = document.getElementById('scrubberThumb');
    const currentTime = document.getElementById('currentTime');

    scrubber?.addEventListener('click', (e) => {
      const rect = scrubber.getBoundingClientRect();
      const clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const percentage = (clickX / rect.width) * 100;
      if (progress && thumb) {
        progress.style.width = percentage + '%';
        thumb.style.left = `calc(${percentage}% - 8px)`;
        const totalSeconds = 328;
        const currentSecs = Math.floor((percentage / 100) * totalSeconds);
        const mins = String(Math.floor(currentSecs / 60)).padStart(2, '0');
        const secs = String(currentSecs % 60).padStart(2, '0');
        if (currentTime) currentTime.textContent = `${mins}:${secs}`;
      }
    });
  })();
