name: XMusicFamily
options:
  bundleIdPrefix: com.xmusicfamily
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  XMusicFamily:
    type: application
    platform: iOS
    sources:
      - path: XMusicFamily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xmusicfamily.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "XMusic Family"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
